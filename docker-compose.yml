services:
  # -------------------------------------------------------------------
  # ChiralGraph-RAG Core Service
  # Defaults to Zero-Setup Offline Mode (NetworkX + In-Memory Vector Store + Reasoner)
  # -------------------------------------------------------------------
  chiralgraph-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chiralgraph-rag-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - GRAPH_BACKEND=networkx
      - VECTOR_BACKEND=memory
      - LLM_PROVIDER=mock
      - ETKDG_CONFORMER_COUNT=10
      - FORCE_FIELD=MMFF94
      - MAX_CONFORMER_STRAIN_KCAL=4.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------------
  # Optional Production Services (Run with: docker compose --profile full up)
  # -------------------------------------------------------------------
  neo4j:
    image: neo4j:5.15-community
    container_name: chiralgraph-neo4j
    profiles: ["full"]
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/chiralgraph2026
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: chiralgraph-qdrant
    profiles: ["full"]
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  qdrant_data:
